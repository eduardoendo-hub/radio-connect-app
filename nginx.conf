server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compressão importa muito: a internet no Brasil é ruim e o pacote do Flutter
  # web é grande. Reduz o download em cerca de 70%.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/wasm font/woff2;

  # Os artefatos de build têm hash no nome: podem ficar em cache para sempre.
  location ~* \.(js|wasm|css|png|jpg|jpeg|gif|svg|woff2|ttf|otf)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # O index NUNCA fica em cache: é ele que aponta para a versão nova depois do deploy.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
