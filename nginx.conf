server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compressão importa muito: a internet no Brasil é ruim e o pacote do Flutter web
  # é grande. Corta cerca de 70% do download.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/wasm font/woff2;

  # ── NUNCA em cache ────────────────────────────────────────────────────────
  #
  # O Flutter web NÃO coloca hash no nome do bundle principal: `main.dart.js` se
  # chama assim em toda versão. Cachear esses arquivos por muito tempo prende o
  # usuário numa versão antiga para sempre — foi exatamente o que aconteceu aqui.
  #
  # Estes são os arquivos que mudam de conteúdo mantendo o nome.
  location ~* ^/(index\.html|main\.dart\.js|flutter\.js|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires -1;
    try_files $uri =404;
  }

  # ── Cache longo só para o que realmente é imutável ────────────────────────
  # canvaskit, fontes e imagens embutidas: o conteúdo é fixo para a versão do SDK.
  location ~* ^/(canvaskit|assets)/.*\.(js|mjs|wasm|json|png|jpg|jpeg|webp|gif|svg|woff2|ttf|otf|symbols)$ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
